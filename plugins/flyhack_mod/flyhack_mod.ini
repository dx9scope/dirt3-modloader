; ==============================================================================
; DiRT 3 Flyhack Mod configuration
; ==============================================================================
[Flyhack]
; Key to toggle Flyhack ON / OFF
; Options: F1-F12, NUM0-NUM9, X, C, V, TAB, CAPSLOCK, etc.
ToggleKey = F3

; Gamepad (XInput) button to toggle: DPAD_UP, DPAD_DOWN, L3, R3, LB, RB, BACK, START... NONE = off
GamepadToggle = DPAD_UP

; Flight Movement Keys:
KeyForward     = W
KeyBackward    = S
KeyStrafeLeft  = A
KeyStrafeRight = D
KeyUp          = SPACE
KeyDown        = LCTRL
KeyBoost       = LSHIFT
KeySlow        = LALT

; Rotation / Orientation Keys:
; Left/Right Arrows = Yaw (turn nose left/right)
; Up/Down Arrows    = Pitch (tilt nose down/up)
; Q / E             = Roll (bank left/right)
; R                 = Level horizon (instantly flatten pitch & roll)
KeyYawLeft     = LEFT
KeyYawRight    = RIGHT
KeyPitchUp     = DOWN
KeyPitchDown   = UP
KeyRollLeft    = Q
KeyRollRight   = E
KeyLevel       = R

; Alternate Numpad Rotation Keys (1 = enabled, 0 = disabled)
; Num 4 / 6 = Yaw Left / Right
; Num 8 / 2 = Pitch Down / Up
; Num 7 / 9 = Roll Left / Right
; Num 5     = Level horizon
EnableNumpadRotation = 1

; Movement speeds (in meters per second, 1 m/s = 3.6 km/h):
; 35 m/s = ~126 km/h, 50 m/s = 180 km/h
FlySpeed = 35.0

; Speed multiplier while holding KeyBoost (Shift or Gamepad A):
; 35 * 2.5 = 87.5 m/s = 315 km/h
BoostMultiplier = 2.5

; Vertical ascend / descend speed (m/s):
VerticalSpeed = 22.0

; Rotation speeds in degrees per second:
TurnSpeed = 90.0
RollSpeed = 90.0

; Freeze car completely stationary in mid-air when no movement keys are pressed
FreezePhysicsWhenStill = 1

; Noclip Mode:
; 1 = vehicle passes cleanly through barriers, scenery, terrain and objects without collisions
; 0 = standard collision response
DisableCollisions = 1

; Chase Camera Lock in Flight:
; 1 = camera is rigidly locked behind rear of car (no swinging, no drift lag/tilt)
; 0 = default gameplay camera
LockCamera = 1

; Chase Camera Distance behind car (meters):
CameraDistance = 5.5

; Chase Camera Height above car (meters):
CameraHeight = 1.8

; Show status in the modloader console
ShowConsoleStatus = 1

; ==============================================================================
; Smooth FOV Changer
; ==============================================================================
FovEnabled = 1

; Primary hotkeys: '[' decreases FOV (zoom in), ']' increases FOV (zoom out)
KeyFovDecrease = [
KeyFovIncrease = ]
KeyFovReset    = BACKSPACE

; Alternate hotkeys: PageDown / PageUp, Home to reset
AltKeyFovDecrease = PAGEDOWN
AltKeyFovIncrease = PAGEUP
AltKeyFovReset    = HOME

; Limits and speed
FovMin         = 35.0
FovMax         = 135.0
FovDefault     = 65.0
FovAdjustSpeed = 40.0
FovSmoothSpeed = 12.0

