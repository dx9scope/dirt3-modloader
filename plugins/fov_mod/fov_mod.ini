; ==============================================================================
; DiRT 3 Modloader - Smooth FOV Changer Plugin Configuration
; ==============================================================================

[FOV]
; Primary Hotkeys:
; KeyIncrease: '[' (VK_OEM_4)
; KeyDecrease: ']' (VK_OEM_6)
; KeyReset: Backspace
KeyIncrease = ]
KeyDecrease = [
KeyReset = BACKSPACE

; FOV Limits (degrees)
MinFov = 35.0
MaxFov = 135.0
DefaultFov = 65.0

; Smoothness settings:
; AdjustSpeed: How fast FOV targets changes while holding key (degrees/second)
AdjustSpeed = 35.0

; SmoothSpeed: Interpolation sharpness/lerp speed (higher = faster, lower = softer)
SmoothSpeed = 10.0
