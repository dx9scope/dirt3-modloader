; ==============================================================================
; DiRT 3 Nitro Mod configuration
; ==============================================================================
[Nitro]
; Keyboard key to hold: LSHIFT, RSHIFT, LCTRL, LALT, SPACE, TAB, CAPSLOCK,
; A-Z, 0-9, F1-F24, NUM0-NUM9, MOUSE4, MOUSE5, or a raw VK code (0xA0). NONE = off
Key = LSHIFT

; Gamepad (XInput) button: L3, R3, LB, RB, A, B, X, Y, BACK, START, DPAD_UP... NONE = off
GamepadButton = L3

; Extra acceleration while boosting in m/s^2 (9.81 = +1G). Higher = stronger kick
Acceleration = 14.0

; Boost smoothly fades out approaching this speed (km/h). 0 = no limit
MaxSpeedKmh = 300

; Tank size and consumption (units). 100 / 25 = 4 seconds of boost
Capacity = 100
BurnRate = 25

; Refill speed (units per second) and pause after boosting before refill starts
RegenRate = 10
RegenDelay = 1.5

; Minimum tank needed to start a new boost
MinToActivate = 10

; 1 = never runs out
Infinite = 0

; 1 = flip push direction (only if nitro pushes the car backwards; normally auto-detected)
InvertDirection = 0

; Show nitro bar in the modloader console
ShowHud = 1

; On-screen DirectX HUD nitro gauge (1 = enabled, 0 = disabled)
ShowOverlay = 1

; Screen edge speed vignette and motion streaks when boosting (1 = enabled, 0 = disabled)
SpeedVignette = 1

; On-screen HUD position: -1 for auto (bottom right near tachometer)
; Or specify custom screen coordinates:
HudX = -1
HudY = -1

; On-screen HUD size scale multiplier (1.0 = normal, 1.2 = larger, 0.8 = compact)
HudScale = 1.0
