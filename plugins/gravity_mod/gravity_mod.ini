; DiRT 3 Gravity Mod Configuration
[Gravity]
; Initial gravity multiplier on game start (1.0 = normal Earth gravity, 0.2 = Moon, 0.0 = Zero-G)
DefaultScale=1.0

; Step size for PageUp / PageDown / [ / ] hotkeys
StepSize=0.1

; Hotkeys:
; F6       - Cycle Presets: Earth (1.0G) -> Moon (0.2G) -> Mars (0.5G) -> Zero-G (0.0G) -> Heavy (2.0G) -> Inverted (-1.0G)
; PageUp   - Increase gravity (+0.1G)
; PageDown - Decrease gravity (-0.1G)
; [ / ]    - Decrease / Increase gravity (alternate)
; Home     - Reset to Earth normal (1.0G)
